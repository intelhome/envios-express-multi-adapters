services:
  app:
    container_name: envios-express-container
    build:
      context: .
    image: envios-express-2024:latest
    ports:
      - "4010:4010"
    volumes:
      - .:/usr/src/app
    environment:
      NODE_ENV: production
    restart: always
    # Tiempo para que el cierre ordenado desconecte las sesiones antes del SIGKILL
    stop_grace_period: 20s
    # Limita el tamaño de los logs para que no llenen el disco del servidor
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

